openapi: 3.0.3
info:
  title: ATS Candidate API
  version: 1.0.0
  description: Contract for candidate creation flow in recruiter dashboard MVP.
servers:
  - url: http://localhost:3010
security:
  - bearerAuth: []
paths:
  /api/candidates:
    post:
      summary: Create candidate (CV optional)
      tags: [Candidates]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - email
                - phone
              properties:
                firstName:
                  type: string
                  minLength: 1
                  maxLength: 100
                lastName:
                  type: string
                  minLength: 1
                  maxLength: 100
                email:
                  type: string
                  format: email
                phone:
                  type: string
                  pattern: '^(\\+34[6789]\\d{8}|[6789]\\d{8})$'
                  description: Spain phone format. Supports +34XXXXXXXXX or 9-digit national format.
                address:
                  type: string
                  maxLength: 255
                education:
                  type: string
                  maxLength: 500
                workExperience:
                  type: string
                  maxLength: 4000
                cv:
                  type: string
                  format: binary
                  description: Optional CV file, PDF or DOCX, max 10 MB.
      responses:
        '201':
          description: Candidate created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateCreateResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Duplicate email conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: CV too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/candidates/{candidateId}/cv:
    get:
      summary: Download CV for candidate (authorized roles only)
      tags: [Candidates]
      parameters:
        - name: candidateId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: CV file stream
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        '403':
          description: Forbidden by role policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: CV not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Upload CV after candidate creation
      tags: [Candidates]
      parameters:
        - name: candidateId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [cv]
              properties:
                cv:
                  type: string
                  format: binary
      responses:
        '200':
          description: CV uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CvUploadResponse'
        '400':
          description: Invalid file type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden by role policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: CV too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/candidates/autocomplete:
    get:
      summary: Get autocomplete suggestions for education/experience
      tags: [Candidates]
      parameters:
        - name: field
          in: query
          required: true
          schema:
            type: string
            enum: [education, workExperience]
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Suggestion list
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items:
                      type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CandidateCreateResponse:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
        cvUploaded:
          type: boolean
    CvUploadResponse:
      type: object
      properties:
        candidateId:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            type: string
